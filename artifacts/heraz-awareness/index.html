    <script>
      (() => {
        const fontSteps = [87.5, 100, 112.5, 125, 137.5];
        let theme = 'light';
        let fontStep = 2;
        try {
          const savedTheme = localStorage.getItem('heraz-theme');
          if (savedTheme === 'dark' || savedTheme === 'light') theme = savedTheme;
          const savedFontStep = localStorage.getItem('heraz-font-step');
          if (savedFontStep !== null && /^[0-4]$/.test(savedFontStep)) {
            const parsedFontStep = Number(savedFontStep);
            fontStep = parsedFontStep;
          }
        } catch {
          // Defaults are used when browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.fontStep = String(fontStep);
        document.documentElement.style.fontSize = `${fontSteps[fontStep]}%`;
      })();
    </script>
  </head>
  <body>
      <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
