kind = "web"
previewPath = "/"
title = "حِرز — التوعية بالهوية الرقمية للأطفال"
description = "موقع توعوي عربي لأولياء الأمور في السعودية حول الاستنساخ الرقمي بالذكاء الاصطناعي وحماية الهوية الرقمية للأطفال."
version = "1.0.0"
id = "artifacts/heraz-awareness"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23255

[services.development]
run = "pnpm --filter @workspace/heraz-awareness run dev"

[services.production]
serve = "static"
publicDir = "artifacts/heraz-awareness/dist"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/heraz-awareness", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
PORT = "23255"
BASE_PATH = "/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23255"
BASE_PATH = "/"
